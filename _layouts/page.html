---
layout: default
---
<div class="wrap">
  <div class="page-head">
    {%- if page.eyebrow %}<span class="eyebrow">{{ page.eyebrow }}</span>{% endif -%}
    <h1>{{ page.title }}</h1>
    {%- if page.subtitle %}<p class="lede">{{ page.subtitle }}</p>{% endif -%}
  </div>
  <div class="{% if page.wide %}page-body{% else %}prose{% endif %}">
    {{ content }}
  </div>
</div>
