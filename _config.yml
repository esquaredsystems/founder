# ---------------------------------------------------------------------------
# Site settings
# ---------------------------------------------------------------------------
# NOTE ON URLs
# This repo sits under the `esquaredsystems` organisation, so GitHub Pages
# serves it as a *project* page at:
#     https://esquaredsystems.github.io/founder/
#
# If you ever attach a custom domain (e.g. owaishussain.com) or move the repo
# to a personal account named `owaishussain`, change the two lines below to:
#     url: "https://owaishussain.com"     (or https://owaishussain.github.io)
#     baseurl: ""
# ---------------------------------------------------------------------------

title: Owais A. Hussain
tagline: I make fairy tales out of data
description: >-
  Personal site of Owais A. Hussain — PhD in data mining, 17+ years building
  software for healthcare, education and emerging tech. Research in influence
  mining, machine learning and health informatics.

url: "https://esquaredsystems.github.io"
baseurl: "/founder"

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------
markdown: kramdown
highlighter: rouge
# Fallback only. Each piece sets its own `permalink:` so the month can be
# spelled out — Jekyll has no month-name placeholder.
permalink: /writing/:year/:month/:title/
timezone: Asia/Karachi

kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false

sass:
  style: compressed

# No plugins are required — the site is deliberately plugin-free so it builds
# identically on GitHub Pages, on any Jekyll version, and offline.
plugins: []

# Publish teaching materials stored in the underscore-prefixed course folder.
include:
  - _courses

# ---------------------------------------------------------------------------
# Collections
# ---------------------------------------------------------------------------
collections:
  projects:
    output: true
    permalink: /projects/:name/

  # ---------------------------------------------
  # Jekyll only accepts a file in `_posts/` if it is named `YYYY-MM-DD-slug.ext`. 
  # Drop the slug and Jekyll stops treating the file as a post at all. No error, no warning, the piece just disappears from site.
  writing:
    output: true
    permalink: /writing/:name/

defaults:
  - scope:
      path: ""
      type: writing
    values:
      layout: post
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  - scope:
      path: ""
    values:
      layout: page

# ---------------------------------------------------------------------------
# Navigation (edit to add/remove top-nav items)
# ---------------------------------------------------------------------------
nav:
  - title: Projects
    url: /projects/
  - title: Research
    url: /research/
  - title: Teaching
    url: /teaching/
  - title: Certifications
    url: /certifications/
  # A nav item with `children` becomes a dropdown. The parent still links to
  # its own url; the children appear on hover, focus or tap.
  - title: Writing
    url: /writing/
    children:
      - title: All posts
        url: /writing/
        note: Everything, newest first
      - title: Poetry
        url: /writing/poetry/
        note: غزل، نظم اور دیگر کلام
      - title: Technology
        url: /writing/technology/
        note: Software, data and teaching
      - title: Travel
        url: /writing/travel/
        note: Notes from the road
      - title: Miscellaneous
        url: /writing/misc/
        note: Everything else
  - title: About
    url: /about/

exclude:
  - README.md
  - CONTENT-GUIDE.md
  - tools
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - .sass-cache
  - .jekyll-cache
